# Testes automáticos (AQ-24): roda a cada Pull Request e a cada push na main
name: Testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: aquadata
          POSTGRES_PASSWORD: aquadata
          POSTGRES_DB: aquadata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquadata -d aquadata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # credenciais descartáveis, só do banco temporário do CI
      TEST_DATABASE_URL: postgresql+psycopg://aquadata:aquadata@localhost:5432/aquadata_test
      DATABASE_URL: postgresql+psycopg://aquadata:aquadata@localhost:5432/aquadata_test
      SECRET_KEY: chave-usada-somente-nos-testes-do-ci

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependências (aplicação + testes)
        run: python -m pip install -r requirements-dev.txt

      - name: Testes unitários e de integração
        run: python -m pytest -rs

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build